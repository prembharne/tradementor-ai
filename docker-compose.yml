version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: tradementor-postgres
    environment:
      POSTGRES_DB: tradementor
      POSTGRES_USER: tradementor
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradementor -d tradementor"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tradementor-network

  # Redis for caching/sessions (optional)
  redis:
    image: redis:7-alpine
    container_name: tradementor-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tradementor-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tradementor-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://tradementor:${DB_PASSWORD}@postgres:5432/tradementor
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - STELLAR_NETWORK=${STELLAR_NETWORK:-testnet}
      - STELLAR_RPC_URL=${STELLAR_RPC_URL}
      - STRATEGY_CONTRACT_ADDRESS=${STRATEGY_CONTRACT_ADDRESS}
      - CHALLENGE_CONTRACT_ADDRESS=${CHALLENGE_CONTRACT_ADDRESS}
      - REPUTATION_CONTRACT_ADDRESS=${REPUTATION_CONTRACT_ADDRESS}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - FRONTEND_URL=${FRONTEND_URL}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tradementor-network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tradementor-frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - tradementor-network
    restart: unless-stopped

  # Nginx Reverse Proxy (optional - for SSL termination)
  nginx:
    image: nginx:alpine
    container_name: tradementor-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - tradementor-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  tradementor-network:
    driver: bridge
